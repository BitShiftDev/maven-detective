<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="md-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EA1FE"/>
      <stop offset="1" stop-color="#9D75F8"/>
    </linearGradient>
  </defs>
  <!-- Kachel im BitShiftDev-Stil: Blau-Violett-Verlauf, abgerundet -->
  <rect x="2" y="2" width="36" height="36" rx="9" fill="url(#md-tile)"/>

  <!-- Lupe: Glas leicht aufgehellt, damit der Baum darin lesbar bleibt -->
  <circle cx="17" cy="17" r="9.5" fill="#FFFFFF" fill-opacity="0.28"/>
  <g fill="none" stroke="#0D1117" stroke-linecap="round">
    <circle cx="17" cy="17" r="9.5" stroke-width="3"/>
    <line x1="24" y1="24" x2="31" y2="31" stroke-width="4.5"/>
  </g>

  <!-- Dependency-Baum in der Linse: Wurzel und zwei Abhängigkeiten -->
  <g stroke="#0D1117" stroke-width="1.6" stroke-linecap="round">
    <line x1="17" y1="12.6" x2="13.4" y2="19.4"/>
    <line x1="17" y1="12.6" x2="20.6" y2="19.4"/>
  </g>
  <circle cx="17" cy="12.6" r="2.1" fill="#0D1117"/>
  <circle cx="13.4" cy="19.4" r="2.1" fill="#0D1117"/>
  <!-- die gefundene Ursache: hervorgehobener Knoten -->
  <circle cx="20.6" cy="19.4" r="2.4" fill="#FFB020" stroke="#0D1117" stroke-width="1.2"/>
</svg>
