# U6: leere Zustände – was die Seite tut (zwei Sätze, je eine Zeile)
matrix.about=Zeigt je Artifact, welche Version jedes Modul des Reactors bekommt.\nAbweichungen lassen sich im gemeinsamen Parent mit einem Klick festlegen.
duplicates.about=Sucht Klassen, die in mehr als einem JAR eines Moduls liegen.\nWelche Kopie gewinnt, hängt an der Reihenfolge im Classpath – die Empfehlung sagt, welches JAR weg kann.
exclusions.about=Prüft jede <exclusion> der POMs gegen den heutigen Baum.\nVeraltete schließen nichts mehr aus, doppelte deckt schon eine andere ab – beide können weg.
usage.about=Vergleicht die Klassen, die die Quellen beim Namen nennen, mit den deklarierten Dependencies.\nGemeldet wird, was nur transitiv ankommt, was keine Quelle nennt und was nur Tests brauchen.
upgrade.about=Zeigt vor der Änderung, was ein Versionswechsel in jedem Modul auslöst: gehoben, gesenkt, neu, weg.\nDie POM ändert sich erst mit „Übernehmen“ – nach einer Vorschau als Diff.

