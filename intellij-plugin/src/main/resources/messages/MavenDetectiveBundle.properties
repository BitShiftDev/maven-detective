exclusions.detail.start=<p>Checks every <code>&lt;exclusion&gt;</code> in the project’s POMs: the transitive tree of the dependency is rebuilt from the POMs in the local repository – without the exclusion being checked. If the excluded artifact does not show up in it, the exclusion is <b>stale</b> (typical after an upgrade); if another exclusion of the same dependency already cuts the path, it is <b>redundant</b>.</p>
