# U6: empty states – what the page does (two sentences, one line each)
matrix.about=Shows for each artifact which version every module of the reactor gets.\nDivergences can be pinned in the common parent with one click.
duplicates.about=Looks for classes that are in more than one JAR of a module.\nWhich copy wins depends on the classpath order – the recommendation says which JAR can go.
exclusions.about=Checks every <exclusion> of the POMs against today’s tree.\nStale ones no longer exclude anything, redundant ones are already covered by another – both can go.
usage.about=Compares the classes the sources reference by name with the declared dependencies.\nReports what only arrives transitively, what no source references and what only tests need.
upgrade.about=Shows before the change what a version switch does in every module: upgraded, downgraded, added, removed.\nThe POM only changes with “Apply” – after a preview as a diff.

