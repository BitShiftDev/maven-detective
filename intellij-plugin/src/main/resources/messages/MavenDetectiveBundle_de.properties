exclusions.detail.start=<p>Prüft jede <code>&lt;exclusion&gt;</code> in den POMs des Projekts: Der transitive Baum der Dependency wird aus den POMs im lokalen Repository nachgebaut – ohne die geprüfte Exclusion. Taucht das ausgeschlossene Artifact darin nicht auf, ist die Exclusion <b>veraltet</b> (typisch nach einem Upgrade); kappt eine andere Exclusion derselben Dependency den Pfad schon, ist sie <b>doppelt</b>.</p>
