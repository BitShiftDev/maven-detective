group=io.github.bitshiftdev.mavendetective
version=0.1.0

# Zielplattform des IntelliJ-Plugins. Gebaut wird gegen die älteste unterstützte Version
# (IDEs ab 2026.2 sind mit Java 25 gebaut; wer gegen 2025.3 baut, bleibt bei Java 21 und läuft trotzdem auf neueren IDEs).
platformVersion=2025.3
pluginSinceBuild=253

# Maven-API, gegen die Extension und Fixture-Tests laufen
mavenVersion=3.9.11
mavenResolverVersion=1.9.24

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
