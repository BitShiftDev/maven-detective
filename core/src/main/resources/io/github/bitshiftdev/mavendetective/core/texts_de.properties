# Kommandozeile (cli/Main)
cli.usage=Maven Detective – Build Doctor\n\n  diagnose <build.log | events.jsonl | -> [--project DIR] [--markdown | --id] [--catalog extra.yaml]\n  evaluate <ordner-mit-logs> [--catalog extra.yaml]   (Gate 1: Trefferquote messen)\n  changes [--project DIR]   (was hat sich seit dem letzten grünen Build geändert?)\n  validate-catalog <extra.yaml>\n  why <groupId:artifactId> [--project DIR] [--module DIR] [--tree tree.txt | -] [--markdown] [--local-repo DIR]\n      (Modul A: woher kommt die Version? Baum: mvn dependency:tree -Dverbose > tree.txt)\n  matrix [--project DIR] [--tree tree.txt | -] [--all] [--markdown] [--pin groupId:artifactId[:version]]\n      (Modul A2: welche Module nutzen welche Version? --pin legt sie im gemeinsamen Parent fest)\n  exclusions [--project DIR] [--tree tree.txt | -] [--all] [--markdown] [--remove]\n      (Modul A4: Exclusions, die nichts mehr ausschließen; --remove entfernt sie, Exit 3 = es gibt welche)\n  duplicates [--project DIR] [--tree tree.txt | -] [--all] [--markdown] [--exclude]\n      (Modul A3: Klassen in mehreren JARs; --exclude fügt die empfohlenen Exclusions ein,\n       Exit 3 = verschiedene Fassungen im Laufzeit-Classpath)\n  analyze [--project DIR] [--tree tree.txt | -] [--all] [--markdown] [--declare] [--remove]\n      (Modul A5: genannt, aber nur transitiv da / deklariert, aber nicht genannt; --declare deklariert,\n       --remove entfernt sicher ungenutzte, Exit 3 = es gibt Befunde)\n  upgrade <groupId:artifactId:version | property=wert> [--project DIR] [--tree tree.txt | -] [--all] [--markdown]\n          [--manage] [--fetch] [--apply] [--local-repo DIR]\n      (Modul A6: was ändert sich im Baum, bevor die POM geändert wird? --manage legt die Version im\n       dependencyManagement fest, --fetch lädt fehlende POMs mit Maven, --apply schreibt die Änderung,\n       Exit 3 = Versionen sinken oder neue Konflikte)\n  preflight [--project DIR] [--network] [--nexus URL] [--markdown]\n      (vor dem Build: settings.xml, JDK, Maven, Parents/BOMs, Repositories; --network fragt die\n       Repositories an, --nexus lenkt alle über den eigenen Repository-Manager,\n       Exit 3 = so kann der Build nicht laufen)\n  outline <build.log | -> [--strip] [--context N]\n      (Log-Navigator: Module, gescheitertes Modul, erster echter Fehler; --strip gibt das Log ohne Downloads aus)\n  Alle Befehle: --lang en|de (Standard: -DmavenDetective.language, MAVEN_DETECTIVE_LANGUAGE, Systemsprache)
