# Maven Detective – Fehlerkatalog für Build Doctor, Version 1
#
# Aufbau einer Regel
#   id          eindeutig, kleinbuchstaben-mit-bindestrich
#   number      Kategorie-Nummer aus dem Konzept (1–12; 13+ = Erweiterungen)
#   category    Überschrift der Diagnose-Karte
#   priority    höher gewinnt, wenn mehrere Regeln passen (spezifisch vor allgemein)
#   confidence  certain | likely  – Sicherheit, wenn keine Prüfung etwas bestätigt
#   patterns    Regex gegen jede Fehlerzeile; der erste Treffer in Listenreihenfolge zählt.
#               Einträge sind Regex-Text oder ein Mapping mit regex/cause/fix/confidence.
#               Benannte Gruppen (?<name>…) werden zu Variablen für cause und fix.
#   extract     Regex nur zum Auslesen von Variablen (lösen die Regel nicht aus)
#   unless      Regex, bei deren Treffer die Regel nicht greift
#   outsideTests true = Zeilen aus gescheiterten Tests (Surefire/Failsafe-Ausgabe) zählen nicht. Für
#               Maven-Probleme, deren Muster auch in Meldungen der Anwendung stehen (403, ZipException).
#   checks      Prüfungen (Java, siehe core/check), in Reihenfolge. Die erste bestätigende
#               Prüfung mit eigener Ursache ersetzt cause und liefert den ersten Quick-Fix.
#   cause       Ursache in einem Satz. Platzhalter: {var}, {var|Ersatztext}, {a,b|Ersatz}
#   fix         type + label (+ params). Typen: rebuild, delete-files, open-file,
#               replace-in-file, replace-url, switch-jdk, set-jvm-option, insert-plugin-version,
#               show-dependency, pin-version, remove-exclusion, add-exclusion,
#               add-dependency, remove-dependency, set-scope, set-version, manual
#               POM-Fixes mit artifact kennen optional type (fehlt = jar) und classifier,
#               damit z. B. jar und test-jar derselben Dependency getrennt bleiben.
#
# Sprachen: category, cause und label sind deutsch; category_en, cause_en, label_en (auch in Pattern-Mappings
# und unter fix) liefern den englischen Text. Fehlt eine Variante, gilt der Grundtext. Welche Sprache gilt,
# bestimmt core/Texts (-DmavenDetective.language=en|de, IDE-Einstellung). Der Standardkatalog braucht beide
# (CatalogLanguagesTest).
#
# Regex immer in 'einfache Anführungszeichen' setzen (Backslashes bleiben erhalten,
# ein Apostroph wird als '' geschrieben). Jede neue Regel braucht mindestens eine Logdatei
# unter core/src/test/resources/logs/<regel-id>__<name>.log – der Test prüft sie automatisch.

version: 1

rules:

  # ---------------------------------------------------------------- 3
  - id: http-repository-blocked
    number: 3
    category: HTTP-Repository blockiert
    category_en: 'HTTP repository blocked'
    priority: 95
    confidence: certain
    patterns:
      - 'maven-default-http-blocker'
      - 'Blocked mirror for repositories: \[(?<repoId>[\w.\-]+) \((?<repoUrl>http://[^,\s)]+)'
    extract:
      - 'Blocked mirror for repositories: \[(?<repoId>[\w.\-]+) \((?<repoUrl>http://[^,\s)]+)'
      - 'resolved: (?<artifact>[^\s:,]+:[^\s:,]+:[^\s:,]+(?::[^\s:,]+)?:[^\s:,()]+)'
    cause: 'Das Repository ''{repoId|?}'' ({repoUrl|http://…}) nutzt http://; Maven blockiert unverschlüsselte Repositories seit 3.8.1.'
    cause_en: 'The repository ''{repoId|?}'' ({repoUrl|http://…}) uses http://; Maven blocks unencrypted repositories since 3.8.1.'
    checks: [http-repository, pom-location]
    fix:
      type: manual
      label: 'Alternativ: in settings.xml einen https-Mirror für das Repository eintragen'
      label_en: 'Alternatively: add an https mirror for the repository to settings.xml'

  # ---------------------------------------------------------------- 2
  - id: repository-access-denied
    number: 2
    category: Zugriff verweigert
    category_en: 'Access denied'
    priority: 92
    outsideTests: true
    patterns:
      - 'status code: (?<status>40[13])'
      - 'reason phrase: (?:Unauthorized|Forbidden) \((?<status>40[13])\)'
      - 'Authentication failed for (?<repoUrl>\S+?),? status: (?<status>40[13])'
      - 'Not authorized'
      - 'Return code is: (?<status>40[13])'
      - '\b(?<status>40[13]) (?:Unauthorized|Forbidden)\b'
    extract:
      - 'from/to (?<repoId>[\w.\-]+) \((?<repoUrl>[^)\s]+)\)'
      - '(?:artifact|Could not transfer artifact) (?<artifact>[^\s:,]+:[^\s:,]+:[^\s:,]+(?::[^\s:,]+)?:[^\s:,()]+)'
    cause: 'Das Repository {repoId|} antwortet mit {status|401/403}: Zugangsdaten fehlen, sind falsch oder das Konto hat keine Rechte.'
    cause_en: 'The repository {repoId|} answers with {status|401/403}: credentials are missing, wrong, or the account lacks permissions.'
    checks: [server-id, requested-repository]
    fix:
      type: manual
      label: 'Zugangsdaten in settings.xml prüfen'
      label_en: 'Check the credentials in settings.xml'

  # ---------------------------------------------------------------- 4
  - id: corrupt-jar
    number: 4
    category: Kaputtes JAR im lokalen Repo
    category_en: 'Corrupt JAR in the local repo'
    priority: 90
    outsideTests: true
    patterns:
      - 'zip END header not found'
      - 'invalid LOC header'
      - 'invalid CEN header'
      - 'error in opening zip file'
      - 'zip file is empty'
      - 'error reading (?<file>[^;\r\n]{1,500}?\.jar)'
      - 'ZipException'
      - 'Checksum validation failed'
    extract:
      - '(?<![^\s;:''"=(\[,])(?<file>(?:[A-Za-z]:)?[\\/](?:(?:[^\s:;''"\[]|[ \t](?![\\/]|[A-Za-z]:)){0,400}?[\\/])?[^\s\\/:;''"\[]+\.jar)'
      - '(?:artifact|for) (?<artifact>[^\s:,]+:[^\s:,]+:jar(?::[^\s:,]+)?:[^\s:,()]+)'
      - 'descriptor for (?<artifact>[^\s:,]+:[^\s:,]+:[^\s:,()]+)[:\s]'
    cause: 'Ein JAR im lokalen Repository ist beschädigt ({file|Datei unbekannt}) – meist ein abgebrochener Download.'
    cause_en: 'A JAR in the local repository is corrupt ({file|file unknown}) – usually an aborted download.'
    checks: [corrupt-jar]
    fix:
      type: manual
      label: 'Betroffene Datei im lokalen Repository löschen und neu bauen'
      label_en: 'Delete the affected file in the local repository and rebuild'

  # ---------------------------------------------------------------- 8
  - id: reactor-problem
    number: 8
    category: Reactor-Problem
    category_en: 'Reactor problem'
    priority: 88
    confidence: certain
    patterns:
      - regex: 'Child module (?<module>.+) of (?<file>.+?\.xml) does not exist'
        cause: 'In {file} ist ein Modul eingetragen, dessen Verzeichnis fehlt: {moduleName,module}.'
        cause_en: '{file} lists a module whose directory is missing: {moduleName,module}.'
      - regex: 'contain a cyclic reference: .*cycle in the graph (?<cycle>.+?)(?: @|$)'
        cause: 'Die Module hängen im Kreis voneinander ab: {cycle}.'
        cause_en: 'The modules depend on each other in a cycle: {cycle}.'
        fix:
          type: manual
          label: 'Gemeinsamen Code in ein eigenes Modul auslagern, damit der Kreis aufbricht'
          label_en: 'Move the shared code into a module of its own to break the cycle'
      - regex: 'Could not find the selected project in the reactor: (?<selector>\S+)'
        cause: 'Das mit -pl gewählte Projekt {selector} gibt es im Reactor nicht.'
        cause_en: 'The project {selector} selected with -pl does not exist in the reactor.'
        fix:
          type: manual
          label: '-pl mit Pfad (z. B. -pl services/api) oder :artifactId aufrufen'
          label_en: 'Call -pl with a path (e.g. -pl services/api) or :artifactId'
      - regex: 'Project ''(?<project>[^'']+)'' is duplicated in the reactor'
        cause: 'Zwei Module haben dieselben Koordinaten {project}.'
        cause_en: 'Two modules have the same coordinates {project}.'
      - regex: 'Duplicate project ID'
    checks: [child-module, pom-location]

  # ---------------------------------------------------------------- 7
  - id: invalid-pom
    number: 7
    category: Ungültige POM
    category_en: 'Invalid POM'
    priority: 85
    patterns:
      - regex: 'Non-resolvable parent POM for (?<project>[^\s:]+:[^\s:]+:[^\s:]+): The following artifacts could not be resolved: (?<artifact>[^\s,:]+:[^\s,:]+:[^\s,:]+(?::[^\s,:]+)?:[^\s,:()]+)'
        cause: 'Die Parent-POM {artifact} ist weder über relativePath ({relativePath|../pom.xml}) noch im lokalen Repository zu finden, und kein Repository liefert sie.'
        cause_en: 'The parent POM {artifact} can be found neither via relativePath ({relativePath|../pom.xml}) nor in the local repository, and no repository provides it.'
      - regex: 'Non-resolvable parent POM'
        cause: 'Die Parent-POM ist weder über relativePath noch im Repository zu finden.'
        cause_en: 'The parent POM can be found neither via relativePath nor in the repository.'
      - regex: 'Malformed POM (?<file>.+?\.xml): (?<detail>.+?)\s+@'
        cause: 'Die POM ist kein gültiges Maven-XML: {detail}.'
        cause_en: 'The POM is not valid Maven XML: {detail}.'
        confidence: certain
      - regex: 'Non-parseable POM (?<file>.+?\.xml): (?<detail>.+?)\s+@'
        cause: 'Die POM ist kein wohlgeformtes XML: {detail}.'
        cause_en: 'The POM is not well-formed XML: {detail}.'
        confidence: certain
      - regex: '''(?<field>(?!build\.plugins)[\w.]+)'' for (?<artifact>\S+) is missing'
        cause: 'In der POM fehlt {field} für {artifact} – weder direkt noch über dependencyManagement/BOM gesetzt.'
        cause_en: 'The POM is missing {field} for {artifact} – set neither directly nor via dependencyManagement/BOM.'
        confidence: certain
      - regex: '''(?<field>[\w.]+)'' for (?<artifact>\S+) must be one of'
        cause: 'Ungültiger Wert für {field} bei {artifact}.'
        cause_en: 'Invalid value for {field} at {artifact}.'
        confidence: certain
      - regex: 'Invalid packaging for parent POM'
        cause: 'Die Parent-POM muss packaging pom haben.'
        cause_en: 'The parent POM must have packaging pom.'
        confidence: certain
    extract:
      - 'from/to (?<repoId>[\w.\-]+) \((?<repoUrl>[^)\s]+)\)'
      - 'Cannot access (?<repoId>[\w.\-]+) \((?<repoUrl>[^)\s]+)\) in offline mode'
    checks: [offline-mode, network-failure, last-updated-files, parent-relative-path, pom-location]
    fix:
      type: manual
      label: 'POM korrigieren'
      label_en: 'Fix the POM'

  # ---------------------------------------------------------------- 5
  - id: jdk-mismatch
    number: 5
    category: JDK passt nicht
    category_en: 'JDK does not fit'
    priority: 80
    patterns:
      - 'invalid target release: (?<required>[\d.]+)'
      - 'release version (?<required>\d+) not supported'
      - 'invalid source release: (?<required>[\d.]+)'
      - 'class file version (?<classVersion>\d+)\.\d+\), this version of the Java Runtime only recognizes class file versions up to (?<runtimeClassVersion>\d+)'
      - 'class file has wrong version (?<classVersion>\d+)\.\d+, should be (?<runtimeClassVersion>\d+)'
      - 'UnsupportedClassVersionError'
      - regex: '(?:Source|Target) option (?<required>\d+) is no longer supported'
        cause: 'Das JDK des Maven-Laufs (Java {runner|neu}) kann Java {required} nicht mehr als Ziel erzeugen; das Projekt muss ein höheres Release setzen.'
        cause_en: 'The JDK of the Maven run (Java {runner|new}) can no longer produce Java {required} as a target; the project has to set a higher release.'
        confidence: certain
      - regex: 'Cannot find matching toolchain definitions'
        cause: 'Das Projekt verlangt per Toolchains ein bestimmtes JDK, in ~/.m2/toolchains.xml ist aber keins passend eingetragen.'
        cause_en: 'The project requires a specific JDK via toolchains, but ~/.m2/toolchains.xml has no matching entry.'
        confidence: certain
        fix:
          type: manual
          label: 'Passendes JDK in ~/.m2/toolchains.xml eintragen'
          label_en: 'Add a matching JDK to ~/.m2/toolchains.xml'
    cause: 'Das Projekt verlangt Java {required|eine neuere Version}, Maven läuft aber mit JDK {runner|einer älteren Version}.'
    cause_en: 'The project requires Java {required|a newer version}, but Maven runs with JDK {runner|an older version}.'
    checks: [jdk-version]

  # ---------------------------------------------------------------- 6
  - id: plugin-missing
    number: 6
    category: Plugin fehlt oder ohne Version
    category_en: 'Plugin missing or without version'
    priority: 75
    confidence: certain
    patterns:
      - regex: 'No plugin found for prefix ''(?<prefix>[^'']+)'''
        cause: 'Für den Prefix ''{prefix}'' findet Maven kein Plugin: Tippfehler, Plugin nicht im Projekt eingebunden oder groupId fehlt in <pluginGroups>.'
        cause_en: 'Maven finds no plugin for the prefix ''{prefix}'': a typo, the plugin is not declared in the project, or its groupId is missing from <pluginGroups>.'
        fix:
          type: manual
          label: 'Plugin vollständig aufrufen (groupId:artifactId:version:goal) oder seine groupId in <pluginGroups> eintragen'
          label_en: 'Call the plugin fully qualified (groupId:artifactId:version:goal) or add its groupId to <pluginGroups>'
      - regex: '''build\.plugins\.plugin\.version'' for (?<plugin>\S+) is missing'
        cause: 'Für {plugin} ist keine Version festgelegt; der Build ist dadurch nicht reproduzierbar.'
        cause_en: 'No version is set for {plugin}; this makes the build non-reproducible.'
        fix:
          type: manual
          label: 'Version für {plugin} in <pluginManagement> des Parents festlegen'
          label_en: 'Set the version for {plugin} in the parent''s <pluginManagement>'
      - regex: 'Could not find goal ''(?<goal>[^'']+)'' in plugin (?<plugin>\S+)'
        cause: 'Das Plugin {plugin} kennt kein Goal ''{goal}'' – Tippfehler oder Goal erst in neuerer Plugin-Version.'
        cause_en: 'The plugin {plugin} has no goal ''{goal}'' – a typo, or the goal only exists in a newer plugin version.'
      - regex: 'Unknown lifecycle phase "(?<phase>[^"]+)"'
        cause: '''{phase}'' ist weder eine Lifecycle-Phase noch prefix:goal.'
        cause_en: '''{phase}'' is neither a lifecycle phase nor prefix:goal.'
        fix:
          type: manual
          label: 'Phase prüfen (validate, compile, test, package, verify, install, deploy) oder als prefix:goal angeben'
          label_en: 'Check the phase (validate, compile, test, package, verify, install, deploy) or give it as prefix:goal'
    checks: [plugin-prefix, plugin-version, pom-location]

  # ---------------------------------------------------------------- 11
  - id: enforcer-rule-failed
    number: 11
    category: Enforcer-Regel verletzt
    category_en: 'Enforcer rule violated'
    priority: 70
    confidence: certain
    patterns:
      - regex: 'Detected JDK [Vv]ersion (?<runner>[\d._]+).* is not in the allowed range (?<range>\S+?)\.?$'
        cause: 'Der Enforcer verlangt Java {range}, gebaut wird aber mit {runner}.'
        cause_en: 'The enforcer requires Java {range}, but the build runs with {runner}.'
        fix:
          type: switch-jdk
          label: 'Runner-JDK auf Java {required,range} umstellen'
          label_en: 'Switch the runner JDK to Java {required,range}'
          params:
            required: '{required,range}'
      - regex: 'Detected Maven Version: (?<found>\S+) is not in the allowed range (?<range>\S+?)\.?$'
        cause: 'Der Enforcer verlangt Maven {range}, gebaut wird mit {found}.'
        cause_en: 'The enforcer requires Maven {range}, the build runs with {found}.'
        fix:
          type: manual
          label: 'Maven Wrapper verwenden oder Maven aktualisieren'
          label_en: 'Use the Maven Wrapper or update Maven'
      - regex: 'Dependency convergence error for (?<artifact>\S+)'
        cause: 'Dependency-Konvergenz verletzt: {artifact} kommt über verschiedene Pfade in unterschiedlichen Versionen.'
        cause_en: 'Dependency convergence violated: {artifact} arrives in different versions through different paths.'
      - regex: 'Found Banned Dependency: (?<artifact>\S+)'
        cause: 'Die verbotene Dependency {artifact} ist im Baum.'
        cause_en: 'The banned dependency {artifact} is in the tree.'
      - regex: 'Require upper bound dependencies error for (?<artifact>\S+)'
        cause: 'Für {artifact} gewinnt eine niedrigere Version, als ein anderer Pfad verlangt.'
        cause_en: 'For {artifact} a lower version wins than another path requires.'
      - 'Rule (?<ruleIndex>\d+): (?<rule>[\w.$]+) failed'
      - 'Some Enforcer rules have failed'
    extract:
      - 'Rule \d+: (?<rule>[\w.$]+) failed'
      - 'JDK [Vv]ersion .* is not in the allowed range [\[(](?<required>\d+)'
    cause: 'Die Enforcer-Regel {ruleName,rule|?} ist verletzt.'
    cause_en: 'The enforcer rule {ruleName,rule|?} is violated.'
    checks: [enforcer-rule]

  # ---------------------------------------------------------------- 12
  - id: out-of-memory
    number: 12
    category: Speicher
    category_en: 'Memory'
    priority: 65
    patterns:
      - regex: 'OutOfMemoryError: (?<kind>Java heap space|Metaspace|GC overhead limit exceeded|unable to create native thread|unable to create new native thread)'
        cause: 'Der {memoryTarget|JVM} geht der Speicher aus ({kind}).'
        cause_en: 'The {memoryTarget|JVM} runs out of memory ({kind}).'
        confidence: certain
      - 'java\.lang\.OutOfMemoryError'
      - regex: 'There is insufficient memory for the Java Runtime Environment'
        cause: 'Das Betriebssystem kann der JVM nicht genug Speicher geben – Rechner oder Container hat zu wenig RAM.'
        cause_en: 'The operating system cannot give the JVM enough memory – the machine or container has too little RAM.'
        confidence: certain
      - regex: 'The forked VM terminated without properly saying goodbye'
        cause: 'Die Test-JVM wurde abrupt beendet – meist Speichermangel (OOM-Killer) oder System.exit() im Test.'
        cause_en: 'The test JVM was terminated abruptly – usually lack of memory (OOM killer) or System.exit() in a test.'
    cause: 'Der {memoryTarget|JVM} geht der Speicher aus.'
    cause_en: 'The {memoryTarget|JVM} runs out of memory.'
    checks: [memory-settings]

  # ---------------------------------------------------------------- 10
  - id: runtime-class-conflict
    number: 10
    category: Laufzeitkonflikt in Tests
    category_en: 'Runtime conflict in tests'
    priority: 60
    patterns:
      - 'NoSuchMethodError: (?<member>.+?)\s*$'
      - 'NoSuchFieldError: (?<member>\S+)'
      - 'NoClassDefFoundError: (?<class>[\w/.$]+)'
      - 'AbstractMethodError'
      - 'IncompatibleClassChangeError'
      - 'ClassNotFoundException: (?<class>[\w.$]+)'
    checks: [class-origin]
    cause: 'Zur Laufzeit passt {class,member|eine Klasse} nicht zu der Version, gegen die kompiliert wurde – typischerweise ein Versionskonflikt im Classpath.'
    cause_en: 'At runtime {class,member|a class} does not match the version it was compiled against – typically a version conflict on the classpath.'
    fix:
      type: manual
      label: 'Gewinnende Version prüfen und pinnen (Modul A „Why this version?“)'
      label_en: 'Check and pin the winning version (module A “Why This Version?”)'

  # ---------------------------------------------------------------- 9
  - id: compile-missing-dependency
    number: 9
    category: Compiler-Fehler durch Dependency
    category_en: 'Compiler error caused by a dependency'
    priority: 55
    patterns:
      - regex: 'package (?<package>(?:javax|jakarta)\.(?:servlet|ejb|persistence|ws\.rs|inject|enterprise|faces|annotation|transaction|validation|jms|mail|json|xml\.bind|xml\.ws|xml\.soap|jws|activation|websocket|batch|security|resource|interceptor|decorator)\b[\w.]*) does not exist'
        cause: 'Das Paket {package} gehört zur Java-EE/Jakarta-EE-API und ist beim Kompilieren nicht im Classpath: die API-Dependency fehlt (meist mit Scope provided), oder javax.* und jakarta.* passen nicht zusammen.'
        cause_en: 'The package {package} belongs to the Java EE/Jakarta EE API and is not on the classpath when compiling: the API dependency is missing (usually with scope provided), or javax.* and jakarta.* do not match.'
      - regex: 'package (?<package>[\w.]+) does not exist'
        cause: 'Das Paket {package} ist beim Kompilieren nicht im Classpath: Dependency fehlt, hat den falschen Scope oder wurde per Exclusion entfernt.'
        cause_en: 'The package {package} is not on the classpath when compiling: the dependency is missing, has the wrong scope or was removed by an exclusion.'
      - regex: 'class file for (?<class>[\w.$]+) not found'
        cause: 'Der Compiler braucht {class}, die Klasse liegt aber in keiner Dependency im Classpath – oft fehlt eine transitive Dependency.'
        cause_en: 'The compiler needs {class}, but the class is in no dependency on the classpath – often a transitive dependency is missing.'
      - regex: 'cannot access (?<class>[\w.$]+)'
        cause: 'Der Compiler kann {class} nicht laden – fehlende oder unpassende Dependency.'
        cause_en: 'The compiler cannot load {class} – a missing or mismatching dependency.'
      - regex: 'cannot find symbol'
        cause: 'Der Compiler findet {symbol|ein Symbol}. Stammt es aus einer Bibliothek, fehlt die Dependency oder hat den falschen Scope; sonst ist es ein Fehler im Code.'
        cause_en: 'The compiler cannot find {symbol|a symbol}. If it comes from a library, the dependency is missing or has the wrong scope; otherwise it is a bug in the code.'
    extract:
      - 'symbol:\s+(?:class|variable|method) (?<symbol>[\w$]+)'
    checks: [ee-namespace, source-location, class-location]

  # ---------------------------------------------------------------- 1
  - id: artifact-not-resolvable
    number: 1
    category: Artifact nicht auflösbar
    category_en: 'Artifact cannot be resolved'
    priority: 50
    patterns:
      - 'The following artifacts could not be resolved: (?<artifact>[^\s,:]+:[^\s,:]+:[^\s,:]+(?::[^\s,:]+)?:[^\s,:()]+)'
      - 'Could not find artifact (?<artifact>\S+) in (?<repoId>[\w.\-]+) \((?<repoUrl>[^)\s]+)\)'
      - 'Could not transfer artifact (?<artifact>\S+) from/to (?<repoId>[\w.\-]+) \((?<repoUrl>[^)\s]+)\)'
      - 'Plugin (?<artifact>\S+) or one of its dependencies could not be resolved'
      - 'Cannot access (?<repoId>[\w.\-]+) \((?<repoUrl>[^)\s]+)\) in offline mode and the artifact (?<artifact>\S+) has not been downloaded'
      - 'Failed to read artifact descriptor for (?<artifact>\S+)'
      - 'Could not resolve dependencies for project (?<project>[^\s:]+:[^\s:]+:[^\s:]+:[^\s:]+)'
      - 'was cached in the local repository'
      - 'Failed to collect dependencies at'
      - 'Non-resolvable import POM'
    extract:
      - 'from/to (?<repoId>[\w.\-]+) \((?<repoUrl>[^)\s]+)\)'
      - 'was not found in (?<repoUrl>\S+) during a previous attempt'
      - 'update interval of (?<repoId>[\w.\-]+) has elapsed'
    cause: 'Maven konnte {artifact|ein Artifact} nicht aus {repoId|einem Repository} laden.'
    cause_en: 'Maven could not download {artifact|an artifact} from {repoId|a repository}.'
    checks: [offline-mode, reactor-sibling, network-failure, last-updated-files, requested-repository, pom-location]
    fix:
      type: rebuild
      label: 'Mit -U neu bauen (Update erzwingen)'
      label_en: 'Rebuild with -U (force update)'
      params:
        args: '-U'

  # ---------------------------------------------------------------- 14 (Erweiterung)
  - id: javaee-packaging
    number: 14
    category: EAR/WAR/EJB-Packaging
    category_en: 'EAR/WAR/EJB packaging'
    priority: 82
    confidence: certain
    description: Fehler der Packaging-Plugins in Java-EE-Projekten (maven-ear-plugin, maven-war-plugin, maven-ejb-plugin).
    patterns:
      - regex: 'Artifact\[(?<moduleType>[\w-]+):(?<module>[^\]\s]+)\] is not a dependency of the project'
        cause: '{module} ist im maven-ear-plugin als {moduleType}-Modul eingetragen, steht aber nicht in den <dependencies> der EAR-POM; das Plugin packt nur Dependencies ein.'
        cause_en: '{module} is declared in the maven-ear-plugin as a {moduleType} module but is not in the <dependencies> of the EAR POM; the plugin only packages dependencies.'
        fix:
          type: manual
          label: 'Dependency {module} mit Version und <type>{moduleType}</type> in die EAR-POM eintragen'
          label_en: 'Add the dependency {module} with version and <type>{moduleType}</type> to the EAR POM'
      - regex: 'maven-ear-plugin:(?<pluginVersion>[^:\s]+):.*Invalid version \[(?<eeVersion>[^\]]+)\]'
        cause: 'Das maven-ear-plugin {pluginVersion} kennt die Plattform-Version {eeVersion} aus <version> nicht: Tippfehler, oder die Plugin-Version ist älter als diese Java-EE/Jakarta-EE-Version.'
        cause_en: 'The maven-ear-plugin {pluginVersion} does not know the platform version {eeVersion} from <version>: a typo, or the plugin version is older than this Java EE/Jakarta EE version.'
        fix:
          type: manual
          label: '<version> im maven-ear-plugin prüfen oder das Plugin auf eine aktuelle Version anheben'
          label_en: 'Check <version> in the maven-ear-plugin or raise the plugin to a current version'
      - regex: 'Unable to load the mojo ''(?<goal>[^'']+)'' in the plugin ''(?<plugin>org\.apache\.maven\.plugins:maven-war-plugin:(?<pluginVersion>2\.[^'']*))'' due to an API incompatibility'
        cause: 'Das maven-war-plugin {pluginVersion} läuft nicht auf Java 16 und neuer: die Versionen 2.x greifen per Reflection auf JDK-Interna zu.'
        cause_en: 'The maven-war-plugin {pluginVersion} does not run on Java 16 and newer: versions 2.x access JDK internals via reflection.'
        fix:
          type: manual
          label: 'maven-war-plugin auf 3.4.0 oder neuer anheben'
          label_en: 'Raise the maven-war-plugin to 3.4.0 or newer'
      - regex: 'Error assembling WAR: webxml attribute is required'
        cause: 'Das WAR-Modul {failedModule|} hat keine WEB-INF/web.xml, und das maven-war-plugin verlangt eine (failOnMissingWebXml).'
        cause_en: 'The WAR module {failedModule|} has no WEB-INF/web.xml, and the maven-war-plugin requires one (failOnMissingWebXml).'
        fix:
          type: manual
          label: 'src/main/webapp/WEB-INF/web.xml anlegen oder <failOnMissingWebXml>false</failOnMissingWebXml> setzen, wenn die Anwendung per Annotationen konfiguriert ist'
          label_en: 'Create src/main/webapp/WEB-INF/web.xml, or set <failOnMissingWebXml>false</failOnMissingWebXml> if the application is configured by annotations'
      - regex: 'Error assembling EJB: META-INF/ejb-jar.xml is required for ejbVersion (?<ejbVersion>\S+)'
        cause: 'Mit ejbVersion {ejbVersion} verlangt das maven-ejb-plugin den Deskriptor src/main/resources/META-INF/ejb-jar.xml; ab EJB 3.0 reichen Annotationen.'
        cause_en: 'With ejbVersion {ejbVersion} the maven-ejb-plugin requires the descriptor src/main/resources/META-INF/ejb-jar.xml; from EJB 3.0 on, annotations are enough.'
        fix:
          type: manual
          label: 'META-INF/ejb-jar.xml anlegen oder <ejbVersion> auf 3.x setzen'
          label_en: 'Create META-INF/ejb-jar.xml or set <ejbVersion> to 3.x'
    extract:
      - '(?<pluginArtifact>maven-(?:ear|war|ejb|rar)-plugin):(?<pluginVersion>[^:\s'']+)'
      - ' on project (?<failedModule>[^\s:]+)'
    cause: 'Das Packaging-Plugin {pluginArtifact|} ist gescheitert.'
    cause_en: 'The packaging plugin {pluginArtifact|} failed.'
    checks: [ear-module, plugin-declaration]

  # ---------------------------------------------------------------- 13 (Erweiterung)
  - id: test-failures
    number: 13
    category: Tests fehlgeschlagen
    category_en: 'Tests failed'
    priority: 10
    confidence: certain
    description: Kein Build-Problem, aber der häufigste Grund für BUILD FAILURE – damit es nicht als „unbekannt“ endet.
    patterns:
      - 'There are test failures'
      - 'There were test failures'
      - 'Tests run: \d+, Failures: (?<failures>[1-9]\d*)'
      - 'Tests run: \d+, Failures: \d+, Errors: (?<errors>[1-9]\d*)'
    cause: 'Tests sind fehlgeschlagen – das ist ein Testergebnis, kein Problem mit Maven oder Dependencies.'
    cause_en: 'Tests failed – that is a test result, not a problem with Maven or dependencies.'
    fix:
      type: manual
      label: 'Fehlgeschlagene Tests in target/surefire-reports ansehen'
      label_en: 'Look at the failed tests in target/surefire-reports'
