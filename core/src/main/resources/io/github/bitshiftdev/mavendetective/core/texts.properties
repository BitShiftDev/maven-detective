# Doppelte Klassen (DuplicateClasses)
dup.known.commons.logging=jcl-over-slf4j or spring-jcl replace commons-logging on purpose – the original has to go, otherwise the order decides which logging applies.
dup.known.log4j=log4j-over-slf4j replaces log4j 1.x on purpose – the original has to go.
dup.known.jaxb=jakarta.xml.bind-api 2.x is the successor of javax.xml.bind:jaxb-api with the same javax.* classes.
dup.known.activation=jakarta.activation 1.x is the successor of javax.activation with the same javax.* classes.
dup.known.annotation=jakarta.annotation-api 1.3.x is the successor of javax.annotation-api with the same javax.* classes.
dup.known.validation=jakarta.validation-api 2.x is the successor of javax.validation:validation-api with the same classes.
dup.known.servlet=javax.servlet:servlet-api is the old coordinate (up to 2.5); javax.servlet-api is the successor.
dup.known.jsr311=jsr311-api is JAX-RS 1.x; next to JAX-RS 2.x it leads to NoSuchMethodError.
dup.known.google.collections=google-collections is the predecessor of Guava with partly the same but older classes.
dup.known.asm=asm:asm is the old coordinate of org.ow2.asm:asm.
dup.known.hamcrest=Since Hamcrest 2 everything is in org.hamcrest:hamcrest; hamcrest-core 1.3 brings older copies of the same classes.
dup.known.bcprov=bcprov-jdk18on is the successor of bcprov-jdk15on.
dup.known.bcpkix=bcpkix-jdk18on is the successor of bcpkix-jdk15on.
dup.known.stax=stax:stax-api is the old coordinate of javax.xml.stream:stax-api.
