# Kommandozeile (cli/Main)
cli.usage=Maven Detective – Build Doctor\n\n  diagnose <build.log | events.jsonl | -> [--project DIR] [--markdown | --id] [--catalog extra.yaml]\n  evaluate <folder-with-logs> [--catalog extra.yaml]   (Gate 1: measure the hit rate)\n  changes [--project DIR]   (what has changed since the last green build?)\n  validate-catalog <extra.yaml>\n  why <groupId:artifactId> [--project DIR] [--module DIR] [--tree tree.txt | -] [--markdown] [--local-repo DIR]\n      (module A: where does the version come from? Tree: mvn dependency:tree -Dverbose > tree.txt)\n  matrix [--project DIR] [--tree tree.txt | -] [--all] [--markdown] [--pin groupId:artifactId[:version]]\n      (module A2: which modules use which version? --pin pins it in the common parent)\n  exclusions [--project DIR] [--tree tree.txt | -] [--all] [--markdown] [--remove]\n      (module A4: exclusions that no longer exclude anything; --remove removes them, exit 3 = there are some)\n  duplicates [--project DIR] [--tree tree.txt | -] [--all] [--markdown] [--exclude]\n      (module A3: classes in several JARs; --exclude adds the recommended exclusions,\n       exit 3 = different copies on the runtime classpath)\n  analyze [--project DIR] [--tree tree.txt | -] [--all] [--markdown] [--declare] [--remove]\n      (module A5: referenced but only transitive / declared but not referenced; --declare declares,\n       --remove removes the safely unused ones, exit 3 = there are findings)\n  upgrade <groupId:artifactId:version | property=value> [--project DIR] [--tree tree.txt | -] [--all] [--markdown]\n          [--manage] [--fetch] [--apply] [--local-repo DIR]\n      (module A6: what changes in the tree before the POM is changed? --manage pins the version in\n       dependencyManagement, --fetch downloads missing POMs with Maven, --apply writes the change,\n       exit 3 = versions drop or new conflicts)\n  preflight [--project DIR] [--network] [--nexus URL] [--markdown]\n      (before the build: settings.xml, JDK, Maven, parents/BOMs, repositories; --network asks the\n       repositories, --nexus routes all of them through your own repository manager,\n       exit 3 = the build cannot run like this)\n  outline <build.log | -> [--strip] [--context N]\n      (log navigator: modules, failed module, first real error; --strip prints the log without downloads)\n\n  All commands: --lang en|de (default: -DmavenDetective.language, MAVEN_DETECTIVE_LANGUAGE, system language)
