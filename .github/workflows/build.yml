name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Nur den eigenen Cache-Eintrag wiederherstellen: Fehlt er (verdrängt), nähme setup-gradle sonst
      # den neuesten Eintrag irgendeines Jobs – auch einen mit mehreren GB IDEs – und füllte die Platte.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-strict-match: true
      - name: Unit-Tests (Kern, Katalog, Prüfungen)
        run: ./gradlew :core:test
      - name: Extension bauen und Fixtures mit echtem Maven auslösen
        run: ./gradlew :maven-extension:fixtureTest

  # Maven 3.9 läuft noch auf Java 8 – Kern und Extension müssen dort laden
  extension-on-java8:
    needs: core-and-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Beide JDKs installieren, 21 bleibt Standard: Das Aufräumen von setup-gradle am Jobende
      # braucht Java 17+. Nur der Fixture-Schritt läuft mit Java 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      # Nur den eigenen Cache-Eintrag wiederherstellen: Fehlt er (verdrängt), nähme setup-gradle sonst
      # den neuesten Eintrag irgendeines Jobs – auch einen mit mehreren GB IDEs – und füllte die Platte.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-strict-match: true
      - run: ./gradlew :maven-extension:jar
      - name: Fixtures unter Java 8
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }}
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          bash fixtures/run-fixtures.sh maven-extension/build/libs/maven-detective-extension-*.jar

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Kein Gradle-Cache: Er hielte die heruntergeladenen IDEs (mehrere GB je Version); schon das
      # Entpacken des alten Eintrags (~7,5 GB) füllte die Platte.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Plugin testen und bauen
        run: ./gradlew :intellij-plugin:test :intellij-plugin:buildPlugin :intellij-plugin:releaseNotes

  # Gate 2 – Plugin Verifier, eine IntelliJ-Release-Linie je Job: Alle Linien auf einem Runner
  # (IDEs plus nachgeladene Plugins wie Android/Rust) füllen die Platte (No space left on device).
  # Neue Linie (z. B. 271) erscheint: sie läuft im letzten, nach oben offenen Eintrag mit; bei
  # Platzmangel diesen auf "until: 263.*" begrenzen und eine Zeile für die neue Linie ergänzen.
  plugin-verifier:
    name: plugin-verifier (${{ matrix.since }}${{ matrix.until == '' && '+' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { since: '253', until: '253.*' }
          - { since: '261', until: '261.*' }
          - { since: '262', until: '262.*' }
          - { since: '263', until: '' }
    steps:
      # Reserve: Der Verifier lädt neben der IDE auch Plugins nach, von denen sie abhängt; ab Werk sind nur ~14 GB frei
      - name: Platz schaffen (vorinstallierte Toolchains entfernen)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Kein Gradle-Cache: Er hielte die heruntergeladenen IDEs (mehrere GB je Version); schon das
      # Entpacken des alten Eintrags (~7,5 GB) füllte die Platte.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Plugin Verifier gegen IntelliJ IDEA ${{ matrix.since }}${{ matrix.until == '' && '+' || '' }}
        run: |
          args=("-PverifySince=${{ matrix.since }}")
          if [ -n "${{ matrix.until }}" ]; then args+=("-PverifyUntil=${{ matrix.until }}"); fi
          ./gradlew :intellij-plugin:verifyPlugin "${args[@]}"
          df -h /
