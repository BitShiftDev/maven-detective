name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Kern und Extension auf allen drei Betriebssystemen: Pfade (Windows), Homebrew-Maven (macOS) und
  # mvn.cmd verhalten sich verschieden. Maven ist auf allen Runnern vorinstalliert (Version je Image).
  core-and-extension:
    name: core-and-extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Unter Windows Git Bash: run-fixtures.sh und ./gradlew brauchen eine POSIX-Shell
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # Nur den eigenen Cache-Eintrag wiederherstellen: Fehlt er (verdrängt), nähme setup-gradle sonst
      # den neuesten Eintrag irgendeines Jobs – auch einen mit mehreren GB IDEs – und füllte die Platte.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-home-cache-strict-match: true
      # --continue: Auch nach Fehlschlägen im Kern die Extension-Tests laufen lassen – alle Befunde je OS auf einmal
      - name: Unit-Tests (Kern, Katalog, Prüfungen, Extension)
        run: ./gradlew --continue :core:test :maven-extension:test
      - run: mvn -v
      - name: Extension bauen und Fixtures mit echtem Maven auslösen
        run: ./gradlew :maven-extension:fixtureTest

  # Frühwarnung für Maven 4 (neueste Version von Maven Central, auch Release Candidates).
  # Nicht blockierend: Ein Fehlschlag färbt nur diesen Job rot, nicht den Lauf.
  fixtures-maven4:
    name: fixtures (Maven 4, nicht blockierend)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # Nur den eigenen Cache-Eintrag wiederherstellen: Fehlt er (verdrängt), nähme setup-gradle sonst
      # den neuesten Eintrag irgendeines Jobs – auch einen mit mehreren GB IDEs – und füllte die Platte.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-home-cache-strict-match: true
      - name: Neuestes Maven 4 laden
        run: |
          base=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven
          # Die Metadaten führen die Versionen in Veröffentlichungsreihenfolge – die letzte 4.x ist die neueste
          version=$(curl -fsSL "$base/maven-metadata.xml" | sed -n 's|.*<version>\(4\.[^<]*\)</version>.*|\1|p' | tail -1)
          [ -n "$version" ] || { echo "::error::Keine Maven-4-Version in den Metadaten"; exit 1; }
          file="apache-maven-$version-bin.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$file" "$base/$version/$file"
          echo "$(curl -fsSL "$base/$version/$file.sha512" | awk '{print $1}')  $RUNNER_TEMP/$file" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$version/bin" >> "$GITHUB_PATH"
          echo "Fixtures gegen Maven $version" >> "$GITHUB_STEP_SUMMARY"
      - run: mvn -v
      - name: Extension bauen und Fixtures mit Maven 4 auslösen
        run: ./gradlew :maven-extension:fixtureTest

  # Maven 3.9 läuft noch auf Java 8 – Kern und Extension müssen dort laden
  extension-on-java8:
    needs: core-and-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Beide JDKs installieren, 21 bleibt Standard: Das Aufräumen von setup-gradle am Jobende
      # braucht Java 17+. Nur der Fixture-Schritt läuft mit Java 8.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            8
            21
      # Nur den eigenen Cache-Eintrag wiederherstellen: Fehlt er (verdrängt), nähme setup-gradle sonst
      # den neuesten Eintrag irgendeines Jobs – auch einen mit mehreren GB IDEs – und füllte die Platte.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-home-cache-strict-match: true
      - run: ./gradlew :maven-extension:jar
      - name: Fixtures unter Java 8
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }}
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          bash fixtures/run-fixtures.sh maven-extension/build/libs/maven-detective-extension-*.jar

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # Kein Gradle-Cache: Er hielte die heruntergeladenen IDEs (mehrere GB je Version); schon das
      # Entpacken des alten Eintrags (~7,5 GB) füllte die Platte.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Plugin testen und bauen
        run: ./gradlew :intellij-plugin:test :intellij-plugin:buildPlugin :intellij-plugin:releaseNotes

  # Gate 2 – Plugin Verifier, eine IntelliJ-Release-Linie je Job: Alle Linien auf einem Runner
  # (IDEs plus nachgeladene Plugins wie Android/Rust) füllen die Platte (No space left on device).
  # Neue Linie (z. B. 271) erscheint: sie läuft im letzten, nach oben offenen Eintrag mit; bei
  # Platzmangel diesen auf "until: 263.*" begrenzen und eine Zeile für die neue Linie ergänzen.
  plugin-verifier:
    name: plugin-verifier (${{ matrix.since }}${{ matrix.until == '' && '+' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { since: '253', until: '253.*' }
          - { since: '261', until: '261.*' }
          - { since: '262', until: '262.*' }
          - { since: '263', until: '' }
    steps:
      # Reserve: Der Verifier lädt neben der IDE auch Plugins nach, von denen sie abhängt; ab Werk sind nur ~14 GB frei
      - name: Platz schaffen (vorinstallierte Toolchains entfernen)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # Kein Gradle-Cache: Er hielte die heruntergeladenen IDEs (mehrere GB je Version); schon das
      # Entpacken des alten Eintrags (~7,5 GB) füllte die Platte.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Plugin Verifier gegen IntelliJ IDEA ${{ matrix.since }}${{ matrix.until == '' && '+' || '' }}
        run: |
          args=("-PverifySince=${{ matrix.since }}")
          if [ -n "${{ matrix.until }}" ]; then args+=("-PverifyUntil=${{ matrix.until }}"); fi
          ./gradlew :intellij-plugin:verifyPlugin "${args[@]}"
          df -h /
