name: publish

# Lädt das IntelliJ-Plugin auf den JetBrains Marketplace, sobald ein Release auf GitHub
# veröffentlicht wird (Entwurf aus release.yml → „Publish release“). Vorabversionen gehen in den
# Kanal "eap". Von Hand nachholen: Actions → publish → Run workflow mit dem Tag.
# Die allererste Version muss einmal von Hand auf plugins.jetbrains.com hochgeladen werden (RELEASING.md).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, z. B. v0.1.0'
        required: true
      channel:
        description: 'Marketplace-Kanal'
        required: true
        default: default

permissions:
  contents: read

jobs:
  marketplace:
    runs-on: ubuntu-latest
    # Umgebung erlaubt Freigabe-Regeln und hält die Marketplace-Secrets getrennt (Settings → Environments)
    environment: marketplace
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CHANNEL: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'eap' || 'default') || inputs.channel }}
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Secrets vorhanden
        run: |
          missing=()
          for name in PUBLISH_TOKEN CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secrets fehlen: ${missing[*]} (siehe RELEASING.md)"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Auf den Marketplace hochladen (Kanal ${{ env.CHANNEL }})
        run: ./gradlew :intellij-plugin:publishPlugin "-PpublishChannel=$CHANNEL"
