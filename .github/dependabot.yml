# Wöchentliche Updates, je Ökosystem in einem Sammel-PR. Die Actions sind auf Commit-SHAs gepinnt
# (Version als Kommentar) – Dependabot aktualisiert SHA und Kommentar gemeinsam.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ['*']
    ignore:
      # Die Extension kompiliert compileOnly gegen die slf4j-API, die Maven 3.9 mitbringt (1.7.x) –
      # eine neuere Major-Version wäre zur Laufzeit nicht da.
      - dependency-name: org.slf4j:slf4j-api
        update-types: ['version-update:semver-major']
