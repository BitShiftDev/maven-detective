<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B2E"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="0">
      <stop offset="0" stop-color="#5EA1FE"/>
      <stop offset="1" stop-color="#9D75F8"/>
    </linearGradient>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="38" y2="38">
      <stop offset="0" stop-color="#5EA1FE"/>
      <stop offset="1" stop-color="#9D75F8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C8BFB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C8BFB" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>
  <rect x="0" y="312" width="1280" height="8" fill="url(#accent)" clip-path="url(#frame)"/>

  <!-- Logo (pluginIcon.svg, 40 × 40, auf 4,5-fach) -->
  <g transform="translate(110 70) scale(4.5)">
    <rect x="2" y="2" width="36" height="36" rx="9" fill="url(#tile)"/>
    <g fill="none" stroke="#0D1117" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M9 7.5 H20 L26 13.5 V18 M9 7.5 V31.5 H19"/>
      <path d="M20 7.5 V13.5 H26"/>
      <path d="M13.5 18 L11.5 20.5 L13.5 23 M18 18 L20 20.5 L18 23 M16.6 17.4 L14.9 23.6" stroke-width="1.6"/>
    </g>
    <circle cx="27" cy="25" r="5" fill="#FFFFFF" fill-opacity="0.25"/>
    <g fill="none" stroke="#0D1117" stroke-linecap="round">
      <circle cx="27" cy="25" r="5" stroke-width="2.4"/>
      <line x1="30.7" y1="28.7" x2="33.5" y2="31.5" stroke-width="3"/>
    </g>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="340" y="140" font-size="68" font-weight="700" fill="#F0F6FC">Maven Detective</text>
    <text x="342" y="194" font-size="28" fill="#C9D1D9">Know why your Maven build failed – and fix it in one click.</text>
    <text x="342" y="246" font-size="20" fill="url(#accent)" font-weight="600" letter-spacing="1">INTELLIJ IDEA PLUGIN  ·  MAVEN EXTENSION  ·  COMMAND LINE</text>
  </g>
</svg>
